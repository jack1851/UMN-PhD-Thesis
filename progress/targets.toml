# Word targets per chapter for `just progress`.
#
# Keys are chapter files relative to the repo root. `aliases` lists earlier
# paths of the same chapter so its history survives renames. `target` is the
# rough finished length in words (text + headings + captions, as texcount
# reports them). Targets follow the chapter plan agreed 2026-09-22; the sum
# is 50k words against ~45-47k for the Pastika and Evans theses.
#
# Dates and paces for the burn-up bands (see the docstring of plot() in
# progress.py). Only `deadline` is required for the bands to appear.
#   plan_start   when the planned pace starts
#   plan_end     when the planned pace reaches the target (default: deadline - 8 weeks)
#   max_pace     words/week of a last-minute push (default 3000)
#   danger_days  margin before the last-possible start (default 30)
# A chapter table may override plan_start, plan_end and deadline for its
# own panel.
deadline = 2027-12-31
plan_start = 2026-09-22

[chapters."chapters/01-intro.tex"]
label = "Introduction"
target = 2500
aliases = ["chapters/groundwork/intro.tex", "chapters/intro.tex"]

[chapters."chapters/02-theory.tex"]
label = "SM and left-right symmetry"
target = 6500
aliases = ["chapters/groundwork/theory.tex", "chapters/lrsm_theory.tex", "chapters/science.tex"]

[chapters."chapters/03-detector.tex"]
label = "LHC and CMS"
target = 5500
aliases = ["chapters/detector/experiment.tex", "chapters/experiment.tex", "chapters/detector.tex"]

[chapters."chapters/04-hgcal.tex"]
